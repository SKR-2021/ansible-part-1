- name: functions
  hosts: local
  connection: local
  vars:
    technologies: DevOps, Ansible, Shell, Kubernetes # this is String

    # dictionary == map 
    tags:
      Application: payment
      Environment: dev

    ListTags:
    - key: Application
      value: payment
    - key: Environment
      value: dev

  tasks:
  - name: default variables 
    ansible.builtin.debug:
      msg: "Hello {{ name | default('ramesh') }}"

    # String convert to list
  - name: convert string to list
    ansible.builtin.debug:
      msg: "Technologies are: {{ technologies | split(',') }}"

    # convert map to list
  - name: convert map to list
    ansible.builtin.debug:
      msg: "Tags are {{ tags | dict2items }}"
       
    # convert list to map
  - name: convert lis to map
    ansible.builtin.debug:
      msg: "ListTags are {{ ListTags | items2dict }}"

  - name: read yaml and take it into variable
     ansible.builtin.set_fact:
      student_yaml: "{{ lookup('file', 'Student.yaml') | from_yaml }}"

  - name: convert yaml into json
    ansible.builtin.debug:
      msg: "jason: {{ Student.yaml | to_json }}"