- name: functions
  hosts: local
  connection: local
  vars:
    technologies: DevOps, Ansible, Shell, Kubernetes # this is String
    name: "Karunakar T TKK"
    Email: Info@gmail.com
    ipaddress: "192.168.1.1"

    # dictionary == map 
    tags:
      Application: payment
      Environment: dev

    ListTags:
    - key: Application
      value: payment
    - key: Environment
      value: dev

  tasks:
  - name: default variables 
    ansible.builtin.debug:
      msg: "Hello {{ name | default('ramesh') }}"

    # String convert to list
  - name: convert string to list
    ansible.builtin.debug:
      msg: "Technologies are: {{ technologies | split(',') }}"

    # convert map to list
  - name: convert map to list
    ansible.builtin.debug:
      msg: "Tags are {{ tags | dict2items }}"
       
    # convert list to map
  - name: convert lis to map
    ansible.builtin.debug:
      msg: "ListTags are {{ ListTags | items2dict }}"


  - name: read yaml and take it into variable
    ansible.builtin.set_fact:
      student_yaml: "{{ lookup('file', 'Student.yaml') | from_yaml }}"

  - name: convert yaml into json
    ansible.builtin.debug:
      msg: "jason: {{ student_yaml | to_json }}"

  - name: save json to file
    ansible.builtin.copy:
      dest: ./student-data.json
      content: "{{ student_yaml | to_nice_json }}"

  - name: convert to uppercase 
    ansible.builtin.debug:
      msg: "{{ name | upper }}"

  - name: convert to uppercase 
    ansible.builtin.debug:
      msg: "{{ Email | lower }}"

  - name: check IP address is valid or not
    ansible.builtin.debug: 
      msg: "{ {{ ipaddress | ansible.utils.ipv4 }} }"

  - name: grep for root 
    # ansible.builtin.command: cat /etc/passwd | grep root # It has outcome FAILED
    ansible.builtin.shell: cat /etc/passwd | grep root # It has success outcome 
    register: command_output

  - name: print the command_output
    ansible.builtin.debug:
      msg: "{{ command_output }}"

  - name: redirect the putput
    ansible.builtin.command: ls -ltr   # Error outcome FAILED
    # ansible.builtin.shell: ls -ltr > /tmp/output.txt
    register: redirect_output

  - name: print the redirect_output
    ansible.builtin.debug:
      msg: "{{ redirect_output }}"
